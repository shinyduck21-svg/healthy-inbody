<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MongFit - 회원가입</title>
    <meta name="description" content="MongFit 인바디 관리 시스템 신규 회원가입" />
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
    <div class="login-page">
        <div class="login-card" style="max-width: 450px;">
            <div class="login-logo">💪</div>
            <h1 class="login-title text-gradient">MongFit 가입</h1>
            <p class="login-subtitle">나만의 인바디 변화를 기록하세요</p>

            <form id="signupForm">
                <div class="form-grid mb-2">
                    <div class="form-group">
                        <label class="form-label" for="email">이메일 *</label>
                        <input class="form-input" type="email" id="email" placeholder="example@mongfit.com" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">비밀번호 *</label>
                        <input class="form-input" type="password" id="password" placeholder="비밀번호" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">비밀번호 확인 *</label>
                        <input class="form-input" type="password" id="confirmPassword" placeholder="비밀번호 재입력"
                            required />
                    </div>
                </div>

                <div class="form-grid mb-2">
                    <div class="form-group">
                        <label class="form-label" for="name">이름 *</label>
                        <input class="form-input" type="text" id="name" placeholder="홍길동" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="gender">성별</label>
                        <select class="form-select" id="gender">
                            <option value="">선택 안 함</option>
                            <option value="M">남성</option>
                            <option value="F">여성</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid mb-2">
                    <div class="form-group">
                        <label class="form-label" for="age">나이</label>
                        <input class="form-input" type="number" id="age" placeholder="25" />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="phone">연락처</label>
                        <input class="form-input" type="tel" id="phone" placeholder="010-0000-0000" />
                    </div>
                </div>

                <div id="signupError"
                    style="display:none; color: var(--danger); font-size: 0.85rem; margin-top: 0.5rem; text-align: center;">
                </div>

                <button class="btn btn-primary login-btn mt-2" type="submit" id="signupBtn">
                    회원가입 완료
                </button>
            </form>

            <p class="text-muted mt-3" style="font-size:0.85rem; text-align:center;">
                이미 계정이 있으신가요? <a href="/login" style="color:var(--primary); font-weight:600;">로그인하기</a>
            </p>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        // 이미 로그인된 경우 대시보드로
        if (getToken()) window.location.href = '/';

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signupBtn');
            const errorEl = document.getElementById('signupError');
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            errorEl.style.display = 'none';

            if (password !== confirmPassword) {
                errorEl.textContent = '비밀번호가 일치하지 않습니다.';
                errorEl.style.display = 'block';
                return;
            }

            const body = {
                email: document.getElementById('email').value.trim(),
                password: password,
                name: document.getElementById('name').value.trim(),
                gender: document.getElementById('gender').value || null,
                age: document.getElementById('age').value || null,
                phone: document.getElementById('phone').value.trim() || null
            };

            btn.innerHTML = '<span class="spinner"></span> 가입 처리 중...';
            btn.disabled = true;
            errorEl.style.display = 'none';

            try {
                const res = await fetch('/api/user/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();

                if (data.success) {
                    alert('회원가입이 완료되었습니다. 로그인해주세요!');
                    window.location.href = '/login';
                } else {
                    errorEl.textContent = data.message;
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = '서버에 연결할 수 없습니다.';
                errorEl.style.display = 'block';
            } finally {
                btn.innerHTML = '회원가입 완료';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
