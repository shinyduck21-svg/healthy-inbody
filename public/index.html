<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MongFit - 당신의 건강한 변화를 시작하세요</title>
    <meta name="description" content="인바디 관리부터 맞춤형 건강 프로그램까지, MongFit과 함께하세요." />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0ea5e9" />
    <style>
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            z-index: 10;
            max-width: 800px;
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hero-title {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            line-height: 1.1;
            margin-bottom: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .hero-subtitle {
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-xl {
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            border-radius: 50px;
        }

        .features {
            padding: 5rem 0;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .feature-card {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            transition: var(--transition);
        }

        .feature-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: var(--shadow-lg);
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            display: block;
        }

        /* 배경 장식 */
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: var(--gradient-primary);
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
            border-radius: 50%;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from {
                transform: translate(-10%, -10%);
            }

            to {
                transform: translate(10%, 10%);
            }
        }

        /* 설치 안내 툴팁 */
        #installBanner {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--primary);
            padding: 1rem 2rem;
            border-radius: 50px;
            display: none;
            align-items: center;
            gap: 1rem;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% {
                transform: translateX(-50%) scale(0.5);
                opacity: 0;
            }

            100% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="blob" style="top:-10%; left:-10%;"></div>
    <div class="blob" style="bottom:-10%; right:-10%;"></div>

    <nav class="navbar">
        <div class="container navbar-inner">
            <a href="/" class="navbar-brand">
                <div class="navbar-logo">💪</div>
                <span class="navbar-title">MongFit</span>
            </a>
            <div class="navbar-right">
                <a href="/login" class="btn btn-secondary btn-sm">로그인</a>
                </a>
            </div>
    </nav>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1 class="hero-title">몸, 마음, 삶의 근육은 하나 !!<br><span class="text-gradient">몸이 안정되면<br>삶이 흔들리지 않는다.</span>
                </h1>
                <p class="hero-subtitle">인바디 기록부터 4주 신진대사 리셋까지, 몽핏과 함께 <span class="text-gradient">흔들리지 않는 나</span>를 만들어 보세요.</p>
                <div class="flex gap-1" style="justify-content:center;">
                    <button class="btn btn-primary btn-xl" id="startBtn">지금 시작하기</button>
                </div>
            </div>
        </section>

        <section class="features">
            <div class="container">
                <div class="category-header">
                    <span class="category-tag">CATEGORIES</span>
                    <h2 class="category-title">5개 카테고리</h2>
                </div>

                <div class="category-list">
                    <div class="category-item" style="border-left: 4px solid #8b5cf6;">
                        <div class="category-main">
                            <span class="category-icon-emoji">😴</span>
                            <div class="category-info">
                                <h3 class="category-name">수면</h3>
                                <p class="category-desc">취침/기상 시간  ·  수면 점수</p>
                            </div>
                        </div>
                    </div>

                    <div class="category-item" style="border-left: 4px solid #f59e0b;">
                        <div class="category-main">
                            <span class="category-icon-emoji">🍽️</span>
                            <div class="category-info">
                                <h3 class="category-name">식단</h3>
                                <p class="category-desc">아침/점심/저녁/단식 체크  ·  메모</p>
                            </div>
                        </div>
                    </div>

                    <div class="category-item" style="border-left: 4px solid #3b82f6;">
                        <div class="category-main">
                            <span class="category-icon-emoji">💧</span>
                            <div class="category-info">
                                <h3 class="category-name">물 섭취</h3>
                                <p class="category-desc">컵 수 카운터 (0-10)</p>
                            </div>
                        </div>
                    </div>

                    <div class="category-item" style="border-left: 4px solid #ef4444;">
                        <div class="category-main">
                            <span class="category-icon-emoji">🏃</span>
                            <div class="category-info">
                                <h3 class="category-name">운동</h3>
                                <p class="category-desc">유형  ·  시간(분)  ·  강도</p>
                            </div>
                        </div>
                    </div>

                    <div class="category-item" style="border-left: 4px solid #10b981;">
                        <div class="category-main">
                            <span class="category-icon-emoji">🙏</span>
                            <div class="category-info">
                                <h3 class="category-name">감사일기</h3>
                                <p class="category-desc">자유 텍스트 (최대 500자)</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="installBanner">
        <span>더 빠르고 편하게 앱으로 이용해 보세요!</span>
        <button class="btn btn-primary btn-sm" id="installBtn">앱 설치</button>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        // 이미 로그인된 경우 리다이렉트
        if (getToken()) {
            window.location.href = '/dashboard';
        }

        // PWA 설치 로직
        let deferredPrompt;
        const startBtn = document.getElementById('startBtn');
        const installBanner = document.getElementById('installBanner');
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // 설치 제안 이벤트를 가로채서 보관
            e.preventDefault();
            deferredPrompt = e;
            // 설치 안내 배너 표시
            installBanner.style.display = 'flex';
        });

        async function triggerInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response to the install prompt: ${outcome}`);
                deferredPrompt = null;
                installBanner.style.display = 'none';

                // 설치 시도 후 로그인 페이지로
                window.location.href = '/login';
            } else {
                // 이미 설치되었거나 지원하지 않는 경우 바로 로그인으로
                window.location.href = '/login';
            }
        }

        startBtn.addEventListener('click', triggerInstall);
        installBtn.addEventListener('click', triggerInstall);

        // 서비스 워커 등록
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker 등록 성공'))
                    .catch(err => console.log('Service Worker 등록 실패', err));
            });
        }
    </script>
</body>

</html>
