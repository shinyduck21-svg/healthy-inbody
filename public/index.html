<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MongFit - 당신의 건강한 변화를 시작하세요</title>
    <meta name="description" content="인바디 관리부터 맞춤형 건강 프로그램까지, MongFit과 함께하세요." />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0ea5e9" />
    <style>
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            z-index: 10;
            max-width: 800px;
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hero-title {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            line-height: 1.1;
            margin-bottom: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .hero-subtitle {
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-xl {
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            border-radius: 50px;
        }

        .features {
            padding: 5rem 0;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .feature-card {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            transition: var(--transition);
        }

        .feature-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: var(--shadow-lg);
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            display: block;
        }

        /* 배경 장식 */
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: var(--gradient-primary);
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
            border-radius: 50%;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(10%, 10%); }
        }

        /* 설치 안내 툴팁 */
        #installBanner {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--primary);
            padding: 1rem 2rem;
            border-radius: 50px;
            display: none;
            align-items: center;
            gap: 1rem;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% { transform: translateX(-50%) scale(0.5); opacity: 0; }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }
    </style>
</head>

<body>
    <div class="blob" style="top:-10%; left:-10%;"></div>
    <div class="blob" style="bottom:-10%; right:-10%;"></div>

    <nav class="navbar">
        <div class="container navbar-inner">
            <a href="/" class="navbar-brand">
                <div class="navbar-logo">💪</div>
                <span class="navbar-title">MongFit</span>
            </a>
            <div class="navbar-right">
                <a href="/login" class="btn btn-secondary btn-sm">로그인</a>
            </a>
        </div>
    </nav>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1 class="hero-title">몸, 마음, 그리고 삶의<br><span class="text-gradient">근육을 채우다</span></h1>
                <p class="hero-subtitle">인바디 기록 관리부터 박용우 박사님의 4주 신진대사 리셋 프로그램까지, 몽핏과 함께 건강한 변화를 시작하세요.</p>
                <div class="flex gap-1" style="justify-content:center;">
                    <button class="btn btn-primary btn-xl" id="startBtn">지금 시작하기</button>
                </div>
            </div>
        </section>

        <section class="features">
            <div class="container">
                <div style="text-align:center;">
                    <h2 class="section-title">주요 기능</h2>
                    <p class="text-muted">완벽한 건강 관리를 위한 올인원 솔루션</p>
                </div>

                <div class="feature-grid">
                    <div class="feature-card">
                        <span class="feature-icon">📊</span>
                        <h3>인바디 기록 관리</h3>
                        <p class="text-muted">변화하는 체성분을 직관적인 그래프로 확인하고 관리하세요.</p>
                    </div>
                    <div class="feature-card">
                        <span class="feature-icon">🚀</span>
                        <h3>4주 리셋 프로그램</h3>
                        <p class="text-muted">박용우 박사님의 검증된 신진대사 활성화 미션을 매일 체크합니다.</p>
                    </div>
                    <div class="feature-card">
                        <span class="feature-icon">📅</span>
                        <h3>여성 주기 관리</h3>
                        <p class="text-muted">월경 주기를 기반으로 한 맞춤형 컨디션 케어를 지원합니다.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="installBanner">
        <span>더 빠르고 편하게 앱으로 이용해 보세요!</span>
        <button class="btn btn-primary btn-sm" id="installBtn">앱 설치</button>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        // 이미 로그인된 경우 리다이렉트
        if (getToken()) {
            window.location.href = '/dashboard';
        }

        // PWA 설치 로직
        let deferredPrompt;
        const startBtn = document.getElementById('startBtn');
        const installBanner = document.getElementById('installBanner');
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // 설치 제안 이벤트를 가로채서 보관
            e.preventDefault();
            deferredPrompt = e;
            // 설치 안내 배너 표시
            installBanner.style.display = 'flex';
        });

        async function triggerInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response to the install prompt: ${outcome}`);
                deferredPrompt = null;
                installBanner.style.display = 'none';
                
                // 설치 시도 후 로그인 페이지로
                window.location.href = '/login';
            } else {
                // 이미 설치되었거나 지원하지 않는 경우 바로 로그인으로
                window.location.href = '/login';
            }
        }

        startBtn.addEventListener('click', triggerInstall);
        installBtn.addEventListener('click', triggerInstall);

        // 서비스 워커 등록
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker 등록 성공'))
                    .catch(err => console.log('Service Worker 등록 실패', err));
            });
        }
    </script>
</body>

</html>
