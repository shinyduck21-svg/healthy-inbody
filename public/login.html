<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MongFit - 로그인</title>
  <meta name="description" content="MongFit 인바디 관리 시스템 관리자 로그인" />
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">💪</div>
      <h1 class="login-title text-gradient">MongFit</h1>
      <p class="login-subtitle">인바디 관리 시스템</p>

      <form id="loginForm">
        <div class="form-group mb-2">
          <label class="form-label" for="email">이메일</label>
          <input class="form-input" type="email" id="email" placeholder="example@mongfit.com" required />
        </div>
        <div class="form-group mb-2">
          <label class="form-label" for="password">비밀번호</label>
          <input class="form-input" type="password" id="password" placeholder="비밀번호 입력" autocomplete="current-password"
            required />
        </div>

        <div id="loginError"
          style="display:none; color: var(--danger); font-size: 0.85rem; margin-top: 0.5rem; text-align: center;"></div>

        <button class="btn btn-primary login-btn mt-2" type="submit" id="loginBtn">
          로그인
        </button>
      </form>

      <p class="text-muted mt-3" style="font-size:0.85rem; text-align:center;">
        계정이 없으신가요? <a href="/signup" style="color:var(--primary); font-weight:600;">회원가입</a>
      </p>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    // 이미 로그인된 경우 대시보드로
    if (getToken()) window.location.href = '/';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('loginError');
      const body = {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      };
      btn.innerHTML = '<span class="spinner"></span> 로그인 중...';
      btn.disabled = true;
      errorEl.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();

        if (data.success) {
          saveToken(data.token, data.email, data.role, data.id);

          if (data.role === 'admin') {
            window.location.href = '/';
          } else {
            // 일반 회원은 본인 상세 페이지로 이동
            window.location.href = `/member?id=${data.id}`;
          }
        } else {
          errorEl.textContent = data.message;
          errorEl.style.display = 'block';
        }
      } catch (err) {
        errorEl.textContent = '서버에 연결할 수 없습니다.';
        errorEl.style.display = 'block';
      } finally {
        btn.innerHTML = '로그인';
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
