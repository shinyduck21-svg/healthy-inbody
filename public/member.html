<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MongFit - 회원 상세 정보</title>
    <meta name="description" content="회원 인바디 기록 상세 및 변화 추이 차트 - MongFit" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>

<body>

    <!-- 네비게이션 -->
    <nav class="navbar">
        <div class="container navbar-inner">
            <a href="/" class="navbar-brand">
                <div class="navbar-logo">💪</div>
                <span class="navbar-title">MongFit</span>
            </a>
            <div class="navbar-right">
                <div class="admin-badge">
                    <div class="admin-dot"></div>
                    <span id="adminName">관리자</span>
                </div>
                <button class="btn btn-secondary btn-sm" onclick="logout()">로그아웃</button>
            </div>
        </div>
    </nav>

    <main class="container">
        <!-- 뒤로가기 -->
        <div class="page-header">
            <a href="/" class="back-link">← 회원 목록으로</a>
            <div class="page-header-inner">
                <div class="flex gap-2" style="align-items:center;">
                    <div class="member-avatar avatar-default" id="memberAvatarLarge"
                        style="width:60px;height:60px;font-size:1.6rem;"></div>
                    <div>
                        <h1 id="memberNameTitle">-</h1>
                        <p class="page-subtitle" id="memberSubtitle">-</p>
                    </div>
                </div>
                <div class="flex gap-1">
                    <button class="btn btn-secondary" id="editMemberInfoBtn">✏️ 정보 편집</button>
                    <button class="btn btn-primary" id="addInbodyBtn">＋ 인바디 기록 추가</button>
                </div>
            </div>
        </div>

        <!-- 회원 정보 카드 -->
        <div class="card mb-3">
            <div class="section-title">기본 정보</div>
            <div class="info-grid" id="memberInfoGrid">
                <div class="info-item">
                    <div class="info-key">성별</div>
                    <div class="info-value" id="infoGender">-</div>
                </div>
                <div class="info-item">
                    <div class="info-key">생년월일</div>
                    <div class="info-value" id="infoBirth">-</div>
                </div>
                <div class="info-item">
                    <div class="info-key">연락처</div>
                    <div class="info-value" id="infoPhone">-</div>
                </div>
                <div class="info-item">
                    <div class="info-key">등록일</div>
                    <div class="info-value" id="infoCreated">-</div>
                </div>
                <div class="info-item" style="grid-column:1/-1;">
                    <div class="info-key">메모</div>
                    <div class="info-value" id="infoMemo" style="font-weight:400; color:var(--text-secondary);">-</div>
                </div>
            </div>
        </div>

        <!-- 최신 인바디 요약 -->
        <div class="card mb-3" id="latestInbodyCard" style="display:none;">
            <div class="section-title">최근 측정 결과</div>
            <div id="latestSummary"
                style="display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:1rem;"></div>
        </div>

        <!-- 체중 그래프 -->
        <div class="card mb-3" id="weightChartCard" style="display:none;">
            <div class="section-title" style="margin-bottom:1rem;">⚖️ 체중 변화 추이</div>
            <div class="chart-container">
                <canvas id="weightChart"></canvas>
            </div>
        </div>

        <!-- 인바디 그래프 -->
        <div class="card mb-3" id="inbodyChartCard" style="display:none;">
            <div class="flex-between mb-2" style="flex-wrap:wrap; gap:0.5rem;">
                <div class="section-title" style="margin:0;">📊 인바디 변화 추이</div>
                <div class="flex gap-2" style="align-items:center; flex-wrap:wrap;">
                    <span style="display:flex;align-items:center;gap:0.35rem;font-size:0.8rem;color:#22d3ee;">
                        <span
                            style="display:inline-block;width:12px;height:3px;background:#22d3ee;border-radius:2px;"></span>골격근량(kg)
                    </span>
                    <span style="display:flex;align-items:center;gap:0.35rem;font-size:0.8rem;color:#ef4444;">
                        <span
                            style="display:inline-block;width:12px;height:3px;background:#ef4444;border-radius:2px;"></span>체지방량(kg)
                    </span>
                    <span style="display:flex;align-items:center;gap:0.35rem;font-size:0.8rem;color:#f59e0b;">
                        <span
                            style="display:inline-block;width:12px;height:3px;background:#f59e0b;border-radius:2px;"></span>체지방률(%)
                    </span>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="inbodyComboChart"></canvas>
            </div>
        </div>

        <!-- 인바디 기록 테이블 -->
        <div class="card mb-3">
            <div class="flex-between mb-2">
                <div class="section-title" style="margin:0;">기록 목록</div>
                <span class="badge badge-primary" id="recordCountBadge">0건</span>
            </div>
            <div id="recordsContainer">
                <div class="empty-state" id="recordsEmpty">
                    <div class="empty-state-icon">📋</div>
                    <h3>인바디 기록이 없습니다</h3>
                    <p>'인바디 기록 추가' 버튼으로 첫 기록을 등록해 보세요.</p>
                </div>
                <div class="table-wrapper" id="recordsTable" style="display:none;">
                    <table>
                        <thead>
                            <tr>
                                <th>측정일</th>
                                <th>체중(kg)</th>
                                <th>골격근(kg)</th>
                                <th>체지방(kg)</th>
                                <th>체지방률(%)</th>
                                <th style="text-align:center;">관리</th>
                            </tr>
                        </thead>
                        <tbody id="recordsTbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- ====== 인바디 기록 추가/편집 모달 ====== -->
    <div class="modal-overlay" id="inbodyModal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h2 class="modal-title" id="inbodyModalTitle">인바디 기록 추가</h2>
                <button class="close-btn" onclick="closeInbodyModal()">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editInbodyId" />

                <div class="form-group mb-2">
                    <label class="form-label">측정일 *</label>
                    <input class="form-input" type="date" id="ibMeasuredAt" required />
                </div>

                <div class="divider"></div>
                <p class="section-title">기본 체성분</p>
                <div class="form-grid mb-2">
                    <div class="form-group">
                        <label class="form-label">체중 (kg)</label>
                        <input class="form-input" type="number" step="0.1" id="ibWeight" placeholder="0.0" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">골격근량 (kg)</label>
                        <input class="form-input" type="number" step="0.1" id="ibSkeletal" placeholder="0.0" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">체지방량 (kg)</label>
                        <input class="form-input" type="number" step="0.1" id="ibBodyFat" placeholder="0.0" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">체지방률 (%)</label>
                        <input class="form-input" type="number" step="0.1" id="ibBodyFatPct" placeholder="0.0" />
                    </div>
                </div>


                <div class="divider"></div>
                <div class="form-group">
                    <label class="form-label">특이사항</label>
                    <textarea class="form-textarea" id="ibNotes" placeholder="이번 측정에서 특이한 점이나 메모"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeInbodyModal()">취소</button>
                <button class="btn btn-primary" id="saveInbodyBtn" onclick="saveInbody()">저장</button>
            </div>
        </div>
    </div>

    <!-- 회원 정보 편집 모달 -->
    <div class="modal-overlay" id="editMemberModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">회원 정보 편집</h2>
                <button class="close-btn"
                    onclick="document.getElementById('editMemberModal').classList.remove('active')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-grid mb-2">
                    <div class="form-group">
                        <label class="form-label">이름 *</label>
                        <input class="form-input" type="text" id="editName" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">성별</label>
                        <select class="form-select" id="editGender">
                            <option value="">선택 안 함</option>
                            <option value="M">남성</option>
                            <option value="F">여성</option>
                        </select>
                    </div>
                </div>
                <div class="form-grid mb-2">
                    <div class="form-group">
                        <label class="form-label">생년월일</label>
                        <input class="form-input" type="date" id="editBirth" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">연락처</label>
                        <input class="form-input" type="tel" id="editPhone" />
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">메모</label>
                    <textarea class="form-textarea" id="editMemo"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary"
                    onclick="document.getElementById('editMemberModal').classList.remove('active')">취소</button>
                <button class="btn btn-primary" onclick="saveMemberInfo()">저장</button>
            </div>
        </div>
    </div>

    <!-- 기록 삭제 확인 모달 -->
    <div class="modal-overlay" id="deleteRecordModal">
        <div class="modal" style="max-width:380px;">
            <div class="modal-header">
                <h2 class="modal-title">기록 삭제</h2>
                <button class="close-btn"
                    onclick="document.getElementById('deleteRecordModal').classList.remove('active')">✕</button>
            </div>
            <div class="modal-body">
                <p style="color:var(--text-secondary);">이 인바디 기록을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary"
                    onclick="document.getElementById('deleteRecordModal').classList.remove('active')">취소</button>
                <button class="btn btn-danger" id="confirmDeleteRecordBtn">삭제</button>
            </div>
        </div>
    </div>

    <div class="toast-container"></div>

    <script src="/js/utils.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/member.js"></script>
</body>

</html>
